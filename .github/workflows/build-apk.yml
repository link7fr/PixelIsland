name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships with the Android SDK preinstalled; just point Gradle at it.
      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          SDKM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: pixel-island-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PixelIsland-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PixelIsland-debug.apk \
            --title "Pixel Island (latest debug build)" \
            --notes "Built from ${GITHUB_SHA::7}" --latest
